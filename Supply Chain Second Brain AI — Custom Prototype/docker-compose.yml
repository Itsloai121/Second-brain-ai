services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navohaus
      POSTGRES_USER: navohaus
      POSTGRES_PASSWORD: navohaus
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navohaus"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://navohaus:navohaus@db:5432/navohaus
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
